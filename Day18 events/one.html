  <script>
    // document.getElementById('bg1').onclick = function(){
    //     alert("bg-1 clicked ")
    // }

    //best approach

    document.getElementById("bg1").addEventListener(
      "click",
      (e) => {
        console.log(e);
      },
      false,
    ); //->false - defalut

    //event propagotion

    //event bubbling and event capturing

    document.getElementById("images").addEventListener("click", (e) => {
      console.log("clicked inside the ul ");
    });
    document.getElementById("bg1").addEventListener("click", (e) => {
      console.log("bg1 clicked ");
      // prevents event propagation
    }); //event bubbling -> inner to outer

    // document.getElementById("images").addEventListener("click", (e)=>{

    //     console.log("clicked inside the ul ")

    // },true)  // event cappturing on
    // document.getElementById("bg2").addEventListener("click", (e)=>{

    //   console.log("bg2 clicked ")

    // },true)  //event bubbling -> inner to outer

    document.getElementById("google").addEventListener("click", function (e) {
      e.preventDefault();
      e.stopPropagation();
      console.log("google clicked ");
    });

    //removes by clicking image
    document.querySelector("#images").addEventListener(
      "click",
      (e) => {
        
        
        if (e.target.tagName == "IMG") {
            console.log(e.target.id);
          console.log(e.target.parentNode);
          let removeit = e.target.parentNode;
          removeit.remove();
        }
      },
      false,
    );
